{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<div class="auth-layout auth-layout-simple">
    <div class="auth-card" style="max-width:480px; margin: 6rem auto;">
        <div class="auth-card-header" style="text-align:center;">
            <div style="font-size:3rem; margin-bottom:1rem;">🔑</div>
            <h1>Forgot Password?</h1>
            <p>Enter your registered email and we'll send you a reset link.</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Registered Email</label>
                <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required>
            </div>
            <button type="submit" class="btn-auth-submit">
                <i class="fa-solid fa-paper-plane"></i> Send Reset Link
            </button>
        </form>
        <div style="text-align:center; margin-top:1.5rem;">
            <a href="{{ url_for('auth.login') }}" style="color: var(--primary-teal); text-decoration:none;">
                <i class="fa-solid fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
