{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}
{% block content %}
<div style="min-height:70vh; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:3rem;">
    <div style="font-size:5rem; margin-bottom:1rem;">⚠️</div>
    <h1 style="color:#0B2545; font-size:4rem; margin:0;">500</h1>
    <h2 style="color:#E76F51; margin:0.5rem 0;">Server Error</h2>
    <p style="color:#555; max-width:400px; margin:1rem 0;">Something went wrong on our end. The eco-team has been notified and will fix this shortly.</p>
    <a href="{{ url_for('index') }}" class="btn-hero-primary" style="display:inline-flex; margin-top:1rem;">Back to Safety</a>
</div>
{% endblock %}
