{% extends "base.html" %}
{% block title %}404 - Page Not Found{% endblock %}
{% block content %}
<div style="min-height:70vh; display:flex; align-items:center; justify-content:center; flex-direction:column; text-align:center; padding:3rem;">
    <div style="font-size:5rem; margin-bottom:1rem;">🌊</div>
    <h1 style="color:#0B2545; font-size:4rem; margin:0;">404</h1>
    <h2 style="color:#028090; margin:0.5rem 0;">Page Not Found</h2>
    <p style="color:#555; max-width:400px; margin:1rem 0;">Looks like this wave took you to uncharted waters. The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="btn-hero-primary" style="display:inline-flex; margin-top:1rem;">Back to CleanShores</a>
</div>
{% endblock %}
